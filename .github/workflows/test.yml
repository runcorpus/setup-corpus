name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        corpus-version: [latest, '0.5.3']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./
        with:
          corpus-version: ${{ matrix.corpus-version }}
      - name: Verify CLI and daemon
        env:
          CORPUS_VERSION: ${{ matrix.corpus-version }}
        run: |
          corpus --version
          if [[ "$CORPUS_VERSION" != latest ]]; then
            [[ "$(corpus --version)" == "corpus $CORPUS_VERSION" ]]
          fi
          corpus --json status
      - name: Stop daemon
        if: always()
        run: |
          if command -v corpus >/dev/null 2>&1; then
            corpus daemon stop
          fi
